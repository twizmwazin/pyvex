name: CI

on:
  push:
    branches:
      - master
      - claude/jolly-goldberg-0cj4z5
  pull_request:
  workflow_dispatch:

jobs:
  diag:
    name: VS2026 ICE diagnosis (temporary)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: 'recursive'
      - name: Activate msvc
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Build vex per-file, keep going
        shell: cmd
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build || exit /b 1
          cmake --build build --target vex -- -k 0
